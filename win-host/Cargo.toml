[package]
name = "win-host"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jpeg-encoder = "0.6"
png = "0.17"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_Security", "Win32_System_Com", "Win32_System_DataExchange",
    "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading",
    "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging"
] }
windows = { version = "0.58", features = [
    "Foundation", "Graphics", "Graphics_Capture", "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Media_MediaFoundation",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
    "Win32_System_Variant", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"
